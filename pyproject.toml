[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-jailbreak-entropy"
version = "0.1.0"
description = "Shannon entropy and perplexity anomaly detector for jailbreak interception"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
prompt-jailbreak-entropy = "prompt_jailbreak_entropy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_jailbreak_entropy*"]
